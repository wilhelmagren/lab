[package]
name = "tqe"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { version = "59.2.0", features = ["prettyprint"] }
arrow-arith = "59.2.0"
bytes = "1.12.1"
console_error_panic_hook = "0.1.7"
parquet = "59.2.0"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.128"

[lib]
crate-type = ["cdylib", "rlib"]
